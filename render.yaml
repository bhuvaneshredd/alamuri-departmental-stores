services:
  # Backend Web Service
  - type: web
    name: alamuri-backend
    env: node
    plan: starter
    rootDir: server
    buildCommand: npm install && npx prisma generate --schema=prisma/schema.postgresql.prisma && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alamuri-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false

databases:
  - name: alamuri-db
    plan: free
    databaseName: alamuri_store_db
    user: alamuri_user