version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: alamuri_postgres
    restart: always
    environment:
      POSTGRES_USER: alamuri_user
      POSTGRES_PASSWORD: alamuri_secure_password
      POSTGRES_DB: alamuri_store_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: alamuri_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://alamuri_user:alamuri_secure_password@postgres:5432/alamuri_store_db?schema=public"
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: "production_secret_key_change_me_before_launching"
      CLIENT_URL: "http://localhost:3000"
      RAZORPAY_KEY_ID: "rzp_test_YourKeyHere"
      RAZORPAY_KEY_SECRET: "YourSecretHere"
    depends_on:
      - postgres

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: alamuri_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  postgres_data: